[workspace]
members = ["core", "cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
csrre-core    = { path = "core" }
petgraph      = { version = "0.6", features = ["serde-1"] }
egg           = "0.9"
smallvec      = { version = "1", features = ["union"] }
tokio         = { version = "1", features = ["full"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
anyhow        = "1"
thiserror     = "1"
log           = "0.4"
env_logger    = "0.10"
ndarray       = "0.15"
rand          = "0.8"
hashbrown     = "0.14"
fnv           = "1"
